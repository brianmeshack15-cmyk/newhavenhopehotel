<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Menu</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        overflow-x: hidden;
    }

    /* Sections */
    .section {
        position: absolute;
        width: 100%;
        height: 100vh;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        transform: rotateY(90deg);
        opacity: 0;
        transition: all 0.8s ease;
    }

    .active {
        transform: rotateY(0deg);
        opacity: 1;
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 20px;
    }

    /* Floating buttons */
    .nav {
        position: fixed;
        bottom: 30px;
        right: 30px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .nav button {
        padding: 12px 18px;
        border: none;
        border-radius: 30px;
        background: orange;
        color: black;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .nav button:hover {
        background: white;
    }

    /* Menu items */
    .menu-item {
        margin: 10px;
        font-size: 1.2rem;
    }
</style>
</head>

<body>

<!-- Sections -->

<div id="home" class="section active">
    <h1>Welcome</h1>
    <p>New Haven Hope Hotel Menu</p>
</div>

<div id="food" class="section">
    <h1>Food Menu</h1>
    <div class="menu-item">Grilled Chicken - KES 800</div>
    <div class="menu-item">Beef Steak - KES 1200</div>
    <div class="menu-item">Vegetable Pasta - KES 700</div>
</div>

<div id="drinks" class="section">
    <h1>Drinks</h1>
    <div class="menu-item">Fresh Juice - KES 300</div>
    <div class="menu-item">Cocktail - KES 600</div>
    <div class="menu-item">Coffee - KES 250</div>
</div>

<div id="desserts" class="section">
    <h1>Desserts</h1>
    <div class="menu-item">Ice Cream - KES 400</div>
    <div class="menu-item">Chocolate Cake - KES 500</div>
</div>

<!-- Floating Navigation -->

<div class="nav">
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('food')">Food</button>
    <button onclick="showSection('drinks')">Drinks</button>
    <button onclick="showSection('desserts')">Desserts</button>
</div>

<script>
    function showSection(id) {
        let sections = document.querySelectorAll('.section');

        sections.forEach(section => {
            section.classList.remove('active');
        });

        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
